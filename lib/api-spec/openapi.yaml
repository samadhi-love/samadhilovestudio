openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /replit-auth/session:
    get:
      operationId: getStudioSession
      summary: Return the verified signed-in studio identity
      responses:
        "200":
          description: Verified identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          description: Not signed in
        "403":
          description: Email verification required
        "503":
          description: Identity service unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StudioSession:
      type: object
      required: [userId, email, displayName, fullName]
      properties:
        userId:
          type: string
        email:
          type: string
        displayName:
          type: string
        fullName:
          type: [string, "null"]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

