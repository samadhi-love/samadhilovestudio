kind = "web"
previewPath = "/"
title = "Versual Studio"
description = "Beginner-friendly song creation and easy or advanced visual and lyric videos. Your song. Your world. Your video."
version = "1.0.0"
id = "artifacts/samadhi-love-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19551

[services.development]
run = "pnpm --filter @workspace/samadhi-love-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/samadhi-love-studio", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/samadhi-love-studio", "run", "start" ]

[services.env]
PORT = "19551"
BASE_PATH = "/"
